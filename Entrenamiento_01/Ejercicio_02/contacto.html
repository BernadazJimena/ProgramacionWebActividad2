<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_contacto.css">
    <title>Entrenamiento 01 - Ejercicio 02</title>
</head>

<body>
    <header>
        <nav>
            <a href="index_ejercicio02.html">HOME</a>
            <span>|</span>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <form class="caja-formulario">
            <section class="campo-grupo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">
            </section>
            <section class="campo-grupo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </section>
            <section class="campo-grupo">
                <label for="tel">Tel:</label>
                <input type="tel" id="tel" name="tel">
            </section>
            <section class="campo-grupo">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5"></textarea>
            </section>
            <section class="botones-contenedor">
                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-cancelar">Cancelar</button>
            </section>
        </form>
    </main>

    <footer>
        <a href="../../index.html">Index</a>
        <span>|</span>
        <span>Todos los derechos reservados</span>
    </footer>
</body>

</html>
